services:
  app:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    volumes:
      - .:/app
      - maven-cache:/root/.m2
    ports:
      - "3000:8080"
    environment:
      - SERVER_PORT=8080
    command: ["sh", "-ec", "mvn spring-boot:run -q"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: on-failure

volumes:
  maven-cache:
